<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayotte - Présentation</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <nav>
    <ul class="language-switch">
      <li><button onclick="changeLanguage('en')">English</button></li>
      <li><button onclick="changeLanguage('fr')">Français</button></li>
    </ul>
  </nav>

  <section class="hero-section">
    <h1 class="hero-title" data-lang="hero_section_title"></h1>
    <p class="hero-subtitle" data-lang="hero_section_subtitle"></p>
  </section>

  <section class="activities-section">
    <h2 data-lang="activities_section_title"></h2>

    <div class="activity-cards">
      <div class="activity-card">
        <img class="activity-img" src="assets/images/activity1.jpg" alt="">
        <h3 class="activity-title" data-lang="activity1_title"></h3>
        <p data-lang="activity1_description"></p>
      </div>

      <div class="activity-card">
        <img class="activity-img" src="assets/images/activity2.jpg" alt="">
        <h3 class="activity-title" data-lang="activity2_title"></h3>
        <p data-lang="activity2_description"></p>
      </div>

      <div class="activity-card">
        <img class="activity-img" src="assets/images/activity3.jpg" alt="">
        <h3 class="activity-title" data-lang="activity3_title"></h3>
        <p data-lang="activity3_description"></p>
      </div>
    </div>
  </section>

  <section class="guide-section">
    <div class="guide-card">
      <img src="assets/images/guide.jpg" alt="" class="guide-img">
      <div class="guide-text">
        <h2 data-lang="guide_section_title"></h2>
        <i data-lang="guide_section_subtitle"></i>
        <b>Yamine Daroueche</b>
      </div>
    </div>
  </section>

  <script src="assets/script.js"></script>
</body>
</html>
